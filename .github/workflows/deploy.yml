name: Build and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: '9.0.x'
  # ghcr.io image names must be lowercase — "YawDev" would be rejected, so the
  # owner is spelled out in lowercase rather than derived from github.repository_owner.
  IMAGE: ghcr.io/yawdev/emt-identity-api

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --verbosity normal

  publish:
    needs: build-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write      # to push the version tag and create the GitHub release
      packages: write      # to push to ghcr.io with GITHUB_TOKEN
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          # Minor bumped to 1.1 because Octopus release numbers ran ahead to
          # 1.0.9 while the pipeline was being debugged, and Octopus rejects a
          # duplicate release version. github.run_number would collide until it
          # passed 9.
          echo "VERSION=1.1.${{ github.run_number }}" >> $GITHUB_ENV
          echo "version=1.1.${{ github.run_number }}" >> $GITHUB_OUTPUT

      # --- Image -> GitHub Container Registry ---
      # GITHUB_TOKEN is minted per-run by Actions; no stored registry secret needed.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          docker build -t $IMAGE:$VERSION -t $IMAGE:latest .
          docker push $IMAGE:$VERSION
          docker push $IMAGE:latest

      # Tag the commit so "what shipped" is answerable from git alone, not only
      # from inside Octopus. No "v" prefix: the git tag, the image tag and the
      # Octopus release number are then the same string everywhere.
      - name: Tag and publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            --target "${{ github.sha }}"

      # --- Octopus: create the release. Deploying is the next job, gated. ---
      - uses: OctopusDeploy/install-octopus-cli-action@v3
      - name: Create Octopus release
        uses: OctopusDeploy/create-release-action@v3
        with:
          api_key: ${{ secrets.OCTOPUS_API_KEY }}
          server: ${{ secrets.OCTOPUS_URL }}
          space: ${{ secrets.OCTOPUS_SPACE }}
          project: 'Employee-Management-Identity'
          release_number: ${{ env.VERSION }}

  # Waits for approval on the `production` GitHub environment before running.
  # That approval is the single human gate — Octopus's lifecycle phase stays
  # manual so its own Deploy button still works as a fallback, but in the normal
  # flow the decision is made here and GitHub records the outcome.
  deploy:
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://auth.employee-management-tool.com
    steps:
      - uses: OctopusDeploy/install-octopus-cli-action@v3

      - name: Deploy release to Production
        id: deploy
        uses: OctopusDeploy/deploy-release-action@v3
        with:
          api_key: ${{ secrets.OCTOPUS_API_KEY }}
          server: ${{ secrets.OCTOPUS_URL }}
          space: ${{ secrets.OCTOPUS_SPACE }}
          project: 'Employee-Management-Identity'
          release_number: ${{ needs.publish.outputs.version }}
          environments: Production

      # Without this the job goes green as soon as the deploy is *queued*, so a
      # failed deployment would still show a tick against the environment.
      - name: Wait for the deployment to finish
        uses: OctopusDeploy/await-task-action@v3
        with:
          api_key: ${{ secrets.OCTOPUS_API_KEY }}
          server: ${{ secrets.OCTOPUS_URL }}
          space: ${{ secrets.OCTOPUS_SPACE }}
          server_task_id: ${{ fromJson(steps.deploy.outputs.server_tasks)[0].serverTaskId }}
